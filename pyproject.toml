[project]
name = "apm-threatlens"
version = "0.1.0"
description = "Evidence-driven VAPT orchestration platform"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/threatlens/storage/*.py" = ["E501"]
"tests/postgres_support.py" = ["E501"]
